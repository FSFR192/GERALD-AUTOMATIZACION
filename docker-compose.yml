services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: gerald
      POSTGRES_PASSWORD: ${GERALD_DB_PASSWORD:-gerald}
      POSTGRES_DB: gerald
    ports:
      - "5432:5432"
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gerald"]
      interval: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    profiles: ["seguridad"]

  mailpit:            # bandeja de correo de pruebas: http://localhost:8025
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles: ["correo"]

volumes:
  datos_pg:
